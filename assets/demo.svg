<rect width="920" height="370" rx="10" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="919" height="369" rx="10" fill="none" stroke="#30363d"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="460" y="22" text-anchor="middle" fill="#8b949e" style="font-size:12px">acme-shop</text>
<line x1="0" y1="36" x2="920" y2="36" stroke="#30363d"/>
<g id="l0"><text x="22" y="62" xml:space="preserve"><tspan fill="#5eead4">$</tspan><tspan fill="#e6edf3"> npx flowrail init --yes</tspan></text><rect id="cl0" x="37.66" y="47" width="197.8" height="20" fill="#0d1117"/></g>
<g id="l1"><text x="22" y="82" xml:space="preserve"><tspan fill="#e6edf3">Found  git repo (main), CLAUDE.md with 2 rules</tspan></text></g>
<g id="l2"><text x="22" y="102" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#3fb950">covered</tspan><tspan fill="#e6edf3">      "Never push to main without asking"  CLAUDE.md</tspan></text></g>
<g id="l3"><text x="22" y="122" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#3fb950">covered</tspan><tspan fill="#e6edf3">      "Do not delete anything in content/"  CLAUDE.md</tspan></text></g>
<g id="l4"><text x="22" y="142" xml:space="preserve"><tspan fill="#3fb950">✓ The guard is set up. Red lines: 7 armed; protect-flowrail is built in and always on.</tspan></text></g>
<g id="l5"><text x="22" y="162" xml:space="preserve"><tspan fill="#8b949e">  ✓ no-destructive-git        held 4/4   allowed 3/3</tspan></text></g>
<g id="l6"><text x="22" y="182" xml:space="preserve"><tspan fill="#8b949e">  ✓ no-rm-rf-outside-project  held 4/4   allowed 2/2</tspan></text></g>
<g id="l7"><text x="22" y="202" xml:space="preserve"><tspan fill="#8b949e">  ✓ protect-path-content      held 6/6   allowed 3/3</tspan></text></g>
<g id="l8"><text x="22" y="222" xml:space="preserve"><tspan fill="#3fb950">✓ Verified: 7 rules, 29 probes held, 19 allowed as expected.</tspan></text></g>
<g id="l9"><text x="22" y="242" xml:space="preserve"><tspan fill="#8b949e">held = dangerous examples stopped; allowed = harmless examples let through; block = never runs; ask = Claude</tspan></text></g>
<g id="l10"><text x="22" y="262" xml:space="preserve"><tspan fill="#8b949e">Code asks you first</tspan></text></g>
<g id="l11"><text x="22" y="62" xml:space="preserve"><tspan fill="#8b949e"># later, in a Claude Code session in the same repo</tspan></text></g>
<g id="l12"><text x="22" y="82" xml:space="preserve"><tspan fill="#e6edf3">● Bash(git push --force origin main)</tspan></text><rect id="cl12" x="37.66" y="67" width="283.9" height="20" fill="#0d1117"/></g>
<g id="l13"><text x="22" y="102" xml:space="preserve"><tspan fill="#ff7b72">  ⎿  held (block)</tspan></text></g>
<g id="l14"><text x="22" y="122" xml:space="preserve"><tspan fill="#e6edf3">     flowrail red line no-destructive-git: No destructive git commands (force push). Force pushes, hard</tspan></text></g>
<g id="l15"><text x="22" y="142" xml:space="preserve"><tspan fill="#e6edf3">     resets, forced cleans and branch deletes lose work that may not exist anywhere else.</tspan></text></g>
<g id="l16"><text x="22" y="182" xml:space="preserve"><tspan fill="#e6edf3">● Bash(rm -rf ~)</tspan></text><rect id="cl16" x="37.66" y="167" width="127.3" height="20" fill="#0d1117"/></g>
<g id="l17"><text x="22" y="202" xml:space="preserve"><tspan fill="#ff7b72">  ⎿  held (block)</tspan></text></g>
<g id="l18"><text x="22" y="222" xml:space="preserve"><tspan fill="#e6edf3">     flowrail red line no-rm-rf-outside-project: No recursive deletes outside the project (rm -r ~).</tspan></text></g>
<g id="l19"><text x="22" y="242" xml:space="preserve"><tspan fill="#e6edf3">     One typo away from an empty disk.</tspan></text></g>
<g id="l20"><text x="22" y="62" xml:space="preserve"><tspan fill="#5eead4">$</tspan><tspan fill="#e6edf3"> npx flowrail audit --demo</tspan></text><rect id="cl20" x="37.66" y="47" width="213.4" height="20" fill="#0d1117"/></g>
<g id="l21"><text x="22" y="82" xml:space="preserve"><tspan fill="#8b949e">Demo: fictional transcripts bundled with flowrail (a made-up project, /work/acme-shop, whose settings.json</tspan></text></g>
<g id="l22"><text x="22" y="102" xml:space="preserve"><tspan fill="#8b949e">denies git push --force and asks before git push), replayed through the starter red lines.</tspan></text></g>
<g id="l23"><text x="22" y="142" xml:space="preserve"><tspan fill="#e6edf3">Last 30 days: 20 tool calls in 3 sessions.</tspan></text></g>
<g id="l24"><text x="22" y="162" xml:space="preserve"><tspan fill="#e6edf3">flowrail would have held 3 (2 no-destructive-git, 1 no-rm-rf-outside-project) and asked first on 5 (2</tspan></text></g>
<g id="l25"><text x="22" y="182" xml:space="preserve"><tspan fill="#e6edf3">no-push-without-asking, 1 ask-before-mcp-actions, 1 no-secrets-in-repo, 1 protect-flowrail).</tspan></text></g>
<g id="l26"><text x="22" y="202" xml:space="preserve"><tspan fill="#5eead4">Your settings.json permissions (2 deny/ask rules) would have caught 2; flowrail adds 6:</tspan></text></g>
<g id="l27"><text x="22" y="242" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">held </tspan><tspan fill="#e6edf3">  Jun 8, 10:10    no-destructive-git        git reset --hard origin/main</tspan></text></g>
<g id="l28"><text x="22" y="262" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">asked</tspan><tspan fill="#e6edf3">  Jun 8, 10:06    no-push-without-asking    mcp__github__merge_pull_request {"pullNumber":42}</tspan></text></g>
<g id="l29"><text x="22" y="282" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">asked</tspan><tspan fill="#e6edf3">  Jun 8, 10:04    ask-before-mcp-actions    mcp__gmail__send_email {"to":"customer@example.com",...</tspan></text></g>
<g id="l30"><text x="22" y="302" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">held </tspan><tspan fill="#e6edf3">  Jun 4, 14:22    no-rm-rf-outside-project  rm -rf ../acme-shop-old</tspan></text></g>
<g id="l31"><text x="22" y="322" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">asked</tspan><tspan fill="#e6edf3">  Jun 4, 14:20    protect-flowrail          Write .claude/settings.json</tspan></text></g>
<g id="l32"><text x="22" y="342" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">asked</tspan><tspan fill="#e6edf3">  Jun 2, 09:25    no-secrets-in-repo        cat .env</tspan></text></g>
</svg>
